name: TWSE tracking snapshot
on:
  schedule:
    - cron: '0 10 * * *' # 18:00 Asia/Taipei
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_tracking_updates.py'
      - run: python -m unittest discover -s tests -p 'test_index_candles.py'
      - run: python scripts/update_tracking.py
      - run: python scripts/update_index_candles.py
      - name: Refresh Taiwan market-cap and valuation snapshots
        run: |
          if ! python rotation/build-tw.py; then echo '::warning::Latest TWSE and TPEx snapshots were unavailable or not on the same trading date; kept the previous snapshot.'; fi
          if ! python crossmarket/valuation-refresh-fsc.py; then echo '::warning::FSC valuation refresh did not pass validation; kept the previous snapshot.'; fi
      - name: Commit validated trading dates only
        run: |
          set -euo pipefail
          if git diff --quiet -- tracking/market-snapshot.csv positioning/taiex-ohlc.csv rotation/tw-snapshot.json crossmarket/valuation-data.json; then
            echo 'No new official closes; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tracking/market-snapshot.csv positioning/taiex-ohlc.csv rotation/tw-snapshot.json crossmarket/valuation-data.json
          git commit -m 'Update validated market snapshots'
          git push origin HEAD:main

