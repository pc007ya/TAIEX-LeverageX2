name: Validated daily market data
on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data-writer
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install yfinance pandas
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/frontend.test.cjs
      - run: python update_data.py
      - name: Validate strict JSON
        run: |
          python -c 'import json; json.load(open("data.json"), parse_constant=lambda s: (_ for _ in ()).throw(ValueError(s)))'
      - name: Commit validated snapshot without rebasing generated data
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update validated daily market snapshot"
            git push origin HEAD:main
          fi
