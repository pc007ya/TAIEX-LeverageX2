name: Market data safety checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pandas
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/frontend.test.cjs tests/*.test.mjs
      - run: node --test crossmarket/market.test.mjs crossmarket/valuation.test.cjs rotation/model.test.mjs
      - run: node --check script.js
      - run: |
          python -c 'import json; json.load(open("data.json"), parse_constant=lambda s: (_ for _ in ()).throw(ValueError(s)))'

